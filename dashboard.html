<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>AirPresenter - Live IoT & AI Dashboard</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; margin-top: 15px; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .status-badge { font-size: 32px; font-weight: bold; padding: 20px; border-radius: 10px; text-align: center; background: #334155; margin: 15px 0; transition: 0.3s; }
    .active-gesture { background: #68da5d; color: #000; }
    button { padding: 12px 20px; background: #73acce; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <h1> AirPresenter: Smart Presentation Remote Dashboard</h1>
  <p id="mqtt_status">Koneksi Broker HiveMQ: Menghubungkan...</p>

  <div class="grid">
    <div class="card">
      <h3>Status Prediksi AI (k-NN)</h3>
      <div id="gestureBox" class="status-badge">IDLE (MENUNGGU)</div>
      <p><strong>Status Air Mouse:</strong> <span id="mouseStatus">NONAKTIF</span></p>
      <hr style="border-color:#334155; margin: 20px 0;">
      <h3>Kontrol & Kalibrasi</h3>
      <button onclick="resetChart()">Reset Grafik Sensor</button>
    </div>

    <div class="card">
      <h3>Grafik Real-Time Sensor Gyroscope (rad/s)</h3>
      <canvas id="gyroChart" height="130"></canvas>
    </div>
  </div>

  <script>
    const TOPIC_TELEMETRY = "airpresenter/kelompok_08/telemetry";
    const TOPIC_CONTROL   = "airpresenter/kelompok_08/control";
    const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");

    const ctx = document.getElementById('gyroChart').getContext('2d');
    const gyroChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          { label: 'Gyro X (Vertikal)', data: [], borderColor: '#ef4444', tension: 0.2 },
          { label: 'Gyro Y (Roll)', data: [], borderColor: '#22c55e', tension: 0.2 },
          { label: 'Gyro Z (Horizontal)', data: [], borderColor: '#3b82f6', tension: 0.2 }
        ]
      },
      options: { animation: false, scales: { y: { min: -5, max: 5 } } }
    });

    client.on("connect", () => {
      document.getElementById("mqtt_status").innerText = "Koneksi Broker HiveMQ: Terhubung (WSS) ";
      client.subscribe([TOPIC_TELEMETRY, TOPIC_CONTROL]);
    });

    client.on("message", (topic, message) => {
      const data = JSON.parse(message.toString());

      if (topic === TOPIC_TELEMETRY) {
        const now = new Date(data.timestamp).toLocaleTimeString();
        if (gyroChart.data.labels.length > 30) {
          gyroChart.data.labels.shift();
          gyroChart.data.datasets.forEach(ds => ds.data.shift());
        }
        gyroChart.data.labels.push(now);
        gyroChart.data.datasets[0].data.push(data.gyro.x);
        gyroChart.data.datasets[1].data.push(data.gyro.y);
        gyroChart.data.datasets[2].data.push(data.gyro.z);
        gyroChart.update();
      }

      if (topic === TOPIC_CONTROL) {
        const box = document.getElementById("gestureBox");
        const labels = {
          "swipe_right": "⏭ NEXT SLIDE (SWIPE RIGHT)",
          "swipe_left": "⏮ PREV SLIDE (SWIPE LEFT)",
          "shake": " TOGGLE AIR MOUSE (SHAKE)"
        };
        box.innerText = labels[data.gesture] || data.gesture.toUpperCase();
        box.classList.add("active-gesture");
        document.getElementById("mouseStatus").innerText = data.air_mouse ? "AKTIF " : "NONAKTIF ";

        setTimeout(() => {
          box.innerText = "IDLE (MENUNGGU)";
          box.classList.remove("active-gesture");
        }, 1200);
      }
    });

    function resetChart() {
      gyroChart.data.labels = [];
      gyroChart.data.datasets.forEach(ds => ds.data = []);
      gyroChart.update();
    }
  </script>
</body>
</html>
